<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bom D' Copus — Gestão do Time</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23E4B62B%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 font-family=%22Georgia%22>⚽</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- App shell (visão geral é pública; jogos/atletas/adversários/campos exigem login) -->
<div id="app-shell">
  <header class="mobile-topbar">
    <div class="mobile-topbar-brand">
      <img src="assets/logo-bomdcopus.png" alt="Bom D' Copus">
      <span>BOM D' COPUS</span>
    </div>
    <div class="mobile-topbar-auth">
      <button id="btn-login-mobile" class="btn btn-gold btn-sm">Entrar</button>
      <div class="user-chip-mini" id="user-chip-mobile" style="display:none;">
        <img id="user-avatar-mobile" src="" alt="">
        <button id="btn-signout-mobile" class="btn-signout">Sair</button>
      </div>
    </div>
  </header>

  <nav class="sidebar">
    <div class="brand">
      <img src="assets/logo-bomdcopus.png" alt="Bom D' Copus" class="brand-crest-img">
      <div>
        <div class="brand-name">BOM D' COPUS</div>
        <div class="brand-sub">Gestão do time</div>
      </div>
    </div>

    <div class="nav-group-label">Visão geral</div>
    <button class="nav-link" data-route="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="8" width="4" height="12"/><rect x="17" y="4" width="4" height="16"/></svg>
      Dashboard
    </button>
    <button class="nav-link" data-route="ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10l-1 8a4 4 0 0 1-8 0L7 4z"/><path d="M5 6H3a2 2 0 0 0 0 4h1M19 6h2a2 2 0 0 1 0 4h-1"/></svg>
      Ranking
    </button>
    <button class="nav-link" data-route="escalacao-ideal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="6" r="2.4"/><circle cx="5" cy="14" r="2.4"/><circle cx="19" cy="14" r="2.4"/><circle cx="9" cy="20" r="2.4"/><circle cx="15" cy="20" r="2.4"/></svg>
      Escalação ideal
    </button>
    <button class="nav-link" data-route="historico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      Histórico
    </button>

    <div class="nav-group-label nav-protected-only" style="display:none;">Partidas</div>
    <button class="nav-link nav-protected-only" style="display:none;" data-route="jogos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      Jogos
    </button>
    <button class="nav-link nav-protected-only" style="display:none;" data-route="avaliacao">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/></svg>
      Avaliação
    </button>

    <div class="nav-group-label nav-protected-only" style="display:none;">Cadastros</div>
    <button class="nav-link nav-protected-only" style="display:none;" data-route="atletas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/></svg>
      Atletas
    </button>
    <button class="nav-link nav-protected-only" style="display:none;" data-route="adversarios">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4l8 4 8-4v17"/><path d="M4 21h16"/></svg>
      Adversários
    </button>
    <button class="nav-link nav-protected-only" style="display:none;" data-route="campos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="1"/><circle cx="12" cy="12" r="2.4"/><path d="M12 6v12M3 9h3v6H3M18 9h3v6h-3"/></svg>
      Campos
    </button>

    <div class="sidebar-footer">
      <button id="btn-login-desktop" class="btn btn-gold btn-sm btn-login-side">Entrar com Google</button>
      <div class="user-chip" id="user-chip-desktop" style="display:none;">
        <img id="user-avatar" src="" alt="">
        <div style="overflow:hidden;">
          <div id="user-name" class="user-chip-name"></div>
          <div id="user-email" class="user-chip-mail"></div>
        </div>
      </div>
      <button id="btn-signout" class="btn-signout" style="display:none;">Sair</button>
    </div>
  </nav>

  <main id="view-root">
    <div class="loader">Carregando…</div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
